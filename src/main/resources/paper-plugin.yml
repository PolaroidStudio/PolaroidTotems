name: PolaroidTotems
version: '${version}'
main: me.juancayc.polaroidtotems.PolaroidTotemsPlugin

# WHY THIS KEY NOW EXISTS.
#
# This file used to state that there was deliberately no `loader:` key, because the plugin persisted
# nothing — a totem's identity travels inside the item's own PersistentDataContainer, which needs no
# database at all. That was true and is still true OF TOTEMS.
#
# What changed is per-totem cooldowns. A cooldown is a fact about a PLAYER, not about an item, so
# there is nothing to carry it: it has to outlive the player's session and the server's uptime, and
# only storage does that. A cooldown that resets on every restart is not a cooldown, it is a
# suggestion — and the totem it gates is duplicated by any player patient enough to wait for the
# next reboot.
#
# So the plugin now opens a small SQLite (or MySQL) database for that one table, configured in
# data.yml, and needs HikariCP plus a JDBC driver at runtime. Paper has no `libraries:` key — that
# belongs to Spigot's plugin.yml and is silently ignored here — so a loader class declared below is
# the only way to fetch them. See PolaroidTotemsLoader, which also explains why they are resolved
# rather than shaded.
loader: me.juancayc.polaroidtotems.PolaroidTotemsLoader

# FLOOR, not a ceiling — and INJECTED AT BUILD TIME, not written here.
#
# This project ships two jars from one source tree, because Minecraft's versioning changed: the
# 1.x line ended at 1.21.11 and was replaced by calendar versioning (26.1, 26.2, …). The two eras
# need different api-version declarations, and api-version is read by the server before any of our
# code runs, so it cannot be decided at runtime.
#
# `${apiVersion}` is substituted by processResources, driven by the `jar1211` and `jar262` tasks in
# build.gradle.kts:
#
#   jar1211 -> '1.21'   the honest floor for the 1.x line. The plugin's single hard API requirement
#                       is the `minecraft:max_stack_size` data component, which gives each totem
#                       type its own stack size; it shipped in 1.20.5 along with the Paper route we
#                       call for it (ItemStack#setData + DataComponentTypes.MAX_STACK_SIZE). Every
#                       other API we touch (EntityResurrectEvent#getHand, PersistentDataContainer,
#                       EntityEffect.PROTECTED_FROM_DEATH, JavaPlugin#registerCommand) is older or
#                       arrived alongside it. We declare '1.21' rather than '1.20.5' because that is
#                       the oldest line we actually test — declaring a floor below what we test
#                       would be a claim we cannot back.
#
#   jar262  -> '26.2'   the calendar-versioned line. Declaring an old api-version here would route
#                       the plugin through Paper's LEGACY plugin path (material/name remapping),
#                       which is where old-api-version plugins misbehave on 26.x.
#
# Every API call this plugin makes was verified byte-identical between paper-api 1.21.11 and
# paper-api 26.2: same signatures, same call-site descriptors. That is why one source tree is
# enough and there is no compatibility shim — only this one differing line.
api-version: '${apiVersion}'

author: juancayc
description: 'Custom Totems of Undying: per-type stack sizes, inventory-wide activation, configurable effects.'
website: https://github.com/PolaroidStudio/PolaroidTotems

folia-supported: true

# NOTE: there is deliberately no `commands:` block here.
#
# Paper plugins do not support YAML command declarations — that is a legacy plugin.yml feature,
# and JavaPlugin#getCommand throws UnsupportedOperationException for a Paper plugin during
# startup. The command, its description and its aliases (totem, pt) are registered in code by
# CommandRegistrar via JavaPlugin#registerCommand, which must run inside onEnable().

permissions:
  polaroidtotems.use:
    description: Be resurrected by a custom totem from anywhere in the inventory.
    default: true
  polaroidtotems.admin:
    description: Give totems, list totem types and reload the configuration.
    default: op

  # TWO-LEVEL COOLDOWN BYPASS.
  #
  # A totem's `cooldown:` in totems.yml makes a player wait before that same type can save them
  # again. These two nodes exempt a player from that wait, and they are deliberately parent and
  # child of each other:
  #
  #   polaroidtotems.cooldown.bypass            -> exempt from EVERY totem type's cooldown
  #   polaroidtotems.cooldown.bypass.<totemid>  -> exempt from ONE type's cooldown
  #
  # The per-type node being a child is what makes `polaroidtotems.cooldown.bypass.*` work in a
  # permission plugin: an owner can grant every type at once without listing them, while the bare
  # parent stays a separate, deliberate grant. Holding EITHER is enough.
  #
  # Only the parent is declared here. The per-type nodes cannot be — the totem ids come from
  # totems.yml, which this file knows nothing about — so they are simply checked at runtime and
  # default to unset (denied) until an operator grants one.
  #
  # `default: op` matches the rest of this file: the feature is on for ordinary players, and an
  # operator is exempt, which is what an operator testing a totem expects.
  polaroidtotems.cooldown.bypass:
    description: Ignore every totem type's cooldown. Per-type: polaroidtotems.cooldown.bypass.<totemid>
    default: op

# MANDATORY for both hooks below. paper-plugin.yml defaults join-classpath to FALSE (unlike legacy
# plugin.yml, which effectively joined everything). NexoItemHook references Nexo's real classes and
# MythicSkillHook references MythicMobs's, so without this the very first call into either throws
# NoClassDefFoundError. The isPluginEnabled() guard inside each hook controls WHEN we call into that
# plugin, not WHETHER its classes resolve — those are two different failures and only this key fixes
# the second one.
#
# Both are `required: false`: each backs one optional feature (Nexo a totem's ITEM, MythicMobs a
# totem's SKILLS), and a server with neither installed runs the plugin unchanged. `load: BEFORE`
# because both must finish enabling before our onEnable constructs the hooks — and, for MythicMobs,
# before any resurrection can ask it to cast.
dependencies:
  server:
    Nexo:
      load: BEFORE
      required: false
      join-classpath: true
    MythicMobs:
      load: BEFORE
      required: false
      join-classpath: true
