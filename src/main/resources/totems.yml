# ---------------------------------------------------------------------------------------------
#  PolaroidTotems — totem types
# ---------------------------------------------------------------------------------------------
#  Every totem type the server knows lives under the `totems:` key below. The key you write is
#  the type's id: it is what `/totems give <player> <id>` takes, and it is the exact string
#  stamped into the item so the type survives being dropped, chested and traded.
#
#  Ids are lowercased when they are read, so `Guardian` and `guardian` are the same type.
#
#  Reload with `/totems reload`. A broken entry costs you that one type and logs a warning; it
#  never takes the plugin down with it.
# ---------------------------------------------------------------------------------------------
#
#  EVERY KEY A TOTEM CAN HAVE
#  --------------------------
#
#  item: vanilla                  Which item backs this totem.
#                                   vanilla              -> the ordinary Totem of Undying
#                                   vanilla:SOME_MATERIAL-> any vanilla material by name
#                                   nexo:my_totem        -> a Nexo item by its id
#                                 Resolved the moment a totem is handed out, never at startup,
#                                 because Nexo loads its items asynchronously: an id that looks
#                                 missing during boot resolves perfectly ten seconds later.
#
#                                 Careful: a type backed by a material OTHER than
#                                 TOTEM_OF_UNDYING can only be found in a hand, like vanilla.
#                                 Inventory-wide search matches on the totem material, on
#                                 purpose — see the note at the bottom of this file.
#
#  stack-size: 1                  How many of THIS type fit in one slot. Range 1-99.
#                                 Out-of-range values are clamped and logged, not rejected.
#                                 This is the `minecraft:max_stack_size` data component, so it
#                                 is real vanilla behaviour, not a visual trick.
#
#                                 Two types with different sizes never share a stack. That is
#                                 how it has to work: the game compares components to decide
#                                 whether stacks merge, and the size IS a component.
#
#  cooldown: 0                    How long, IN SECONDS, before this type can save the SAME player
#                                 again. 0 or omitted means no cooldown at all, which is what
#                                 every totem does by default.
#
#                                 Per player, per type. Two players never affect each other, and a
#                                 player waiting on `ember` can still be saved by `guardian` in the
#                                 same breath — a totem on cooldown is treated as NOT USABLE, so
#                                 the plugin simply keeps looking through the inventory. The player
#                                 only dies when nothing at all is available, and only then are
#                                 they told how long is left (one message, never one per totem).
#
#                                 Negative values are treated as 0 and logged, the same way an
#                                 out-of-range stack-size is clamped.
#
#                                 SURVIVES RESTARTS. This is the one thing the plugin stores in a
#                                 database rather than inside the item — a cooldown is a fact about
#                                 a player, and there is nowhere in an item to put it. Configure
#                                 where it is stored in data.yml; the default needs no setup.
#
#                                 Two permissions skip the wait entirely, and a player holding
#                                 either has NO cooldown recorded for them at all:
#
#                                   polaroidtotems.cooldown.bypass            every type
#                                   polaroidtotems.cooldown.bypass.<totemid>  one type, e.g.
#                                                                             ...bypass.ember
#
#                                 Both default to op. Grant `...bypass.*` in your permission plugin
#                                 to exempt someone from every type without listing them.
#
#  display-name: '<MiniMessage>'  The item's name. Omit to keep the item's own name.
#  lore:                          Lore lines, MiniMessage, one per entry. Omit to leave alone.
#    - '<MiniMessage>'
#
#  item-model: 'ns:item/my_totem' Which model a resource pack renders for this totem. This is the
#                                 `minecraft:item_model` component, and it is the MODERN way to do
#                                 it: you name the model outright instead of overloading a number.
#                                 A bare value like `item/my_totem` is read in the `minecraft`
#                                 namespace. Omit to leave the item's own model untouched.
#                                 An unparseable key is ignored with a warning, so one typo never
#                                 stops the totem from being handed out.
#
#  custom-model-data: 1001        The LEGACY way to do the same thing. Still supported because
#                                 plenty of existing packs select on this number, but prefer
#                                 item-model for anything new — vanilla moved to it in 1.21.4.
#                                 Omit to leave the item's own value untouched.
#
#                                 The two are independent: set either, both, or neither. When both
#                                 are present the client resolves item_model first, so your pack
#                                 decides which one wins. The plugin does not arbitrate.
#
#                                 NEXO USERS, READ THIS. `item-model` is NOT how you point at a
#                                 Nexo item, and `item-model: 'nexo:my_totem'` does not work. The
#                                 two keys live on different layers:
#
#                                   item:       'nexo:my_totem'   <- an ITEM reference. Nexo hands
#                                                                    back a finished item that
#                                                                    ALREADY carries its model.
#                                   item-model: 'polaroid:item/x' <- a vanilla MODEL key, resolved
#                                                                    by a resource pack.
#
#                                 Written as `item-model: 'nexo:my_totem'` the client would hunt
#                                 for a model named `nexo:my_totem` in the pack, which Nexo never
#                                 registers, and the totem would render as a missing model.
#
#                                 So with Nexo you use `item:` ALONE and leave both appearance keys
#                                 out. Setting item-model on top of a Nexo item overwrites the model
#                                 Nexo just gave it — the plugin stamps after resolving, so your
#                                 value wins and the Nexo texture is lost.
#
#  consume: true                  Whether the totem is used up when it saves the player.
#                                 false makes it reusable — think hard before shipping that.
#
#  heal-to-full: false            Vanilla leaves the player on 1 HP. true tops them up to their
#                                 real maximum health instead (an attribute, not a flat 20).
#
#  permission: ''                 Permission required for this type to fire at all. Blank means
#                                 anyone. A player without it carries the totem uselessly; it is
#                                 simply skipped when the plugin looks for one.
#
#  effects:                       Potion effects granted one tick after the resurrection.
#    - type: REGENERATION         Effect name. Accepts REGENERATION or minecraft:regeneration.
#      seconds: 10                Duration in seconds. Converted to ticks for you.
#      level: 2                   Human level: 1 = I, 2 = II. Not the zero-based amplifier.
#      ambient: false             true = the faint "beacon" particle haze.
#      particles: true            false = no particles at all.
#
#                                 These are applied ON TOP of vanilla's own Regeneration II,
#                                 Absorption II and Fire Resistance, which the game always grants
#                                 on a resurrection. Naming one of those three here simply
#                                 replaces vanilla's version with yours.
#
#  skills:                        MythicMobs skills cast on the same tick as the effects above,
#    - skill: MyTotemSkill        just after them. REQUIRES MYTHICMOBS. Without it this whole key
#      power: 1.0                 is ignored silently — the totem still works, it just casts
#      target-self: true          nothing, so a config is safe to share between servers.
#
#                                 skill:       The skill's internal name, exactly as your Mythic
#                                              skill file declares it. Not validated when this file
#                                              is read: MythicMobs may not have loaded yet, and
#                                              `/mm reload` can change the answer afterwards. A name
#                                              Mythic does not know is logged when it fails to cast.
#                                 power:       Mythic's power multiplier, 1.0 being neutral.
#                                              Negatives are clamped to 0.
#                                 target-self: true hands the revived player to the skill as its
#                                              only entity target. false leaves the target list
#                                              empty so the skill's own @targeter decides — that is
#                                              what you want for an area effect centred on the
#                                              player rather than applied to them.
#
#                                 The player is always the CASTER and the TRIGGER, and the cast
#                                 origin is where they died, whatever target-self says.
#
#                                 Inside the skill you can read which totem invoked it:
#                                   <caster.var.totem_type>   the totem's id, e.g. `guardian`
#                                   <caster.var.totem_power>  the `power:` value above
#                                 So one shared skill can branch per totem instead of you writing
#                                 a near-identical skill for every type.
#
#  conditions:                    WHICH deaths this type may prevent. Omit the whole section (or
#    causes: [VOID]               leave a list empty) and the type fires for any death, anywhere —
#    environments: [THE_END]      exactly what every totem did before this key existed.
#
#                                 causes:       Damage causes of the killing hit: VOID, FALL, LAVA,
#                                               FIRE, DROWNING, ENTITY_ATTACK, PROJECTILE, … (the
#                                               Bukkit DamageCause names). Case does not matter.
#                                 environments: World types the player must be dying in: NORMAL,
#                                               NETHER, THE_END, CUSTOM. Case does not matter.
#
#                                 Both lists must match when both are given. An unknown name is
#                                 skipped with a warning; the rest of the list still applies. If
#                                 EVERY name in a list is a typo, that filter is off — the warning
#                                 tells you so, because "off" means the type fires for anything.
#
#                                 A type whose conditions do not match is treated as NOT USABLE,
#                                 like one on cooldown: the plugin keeps looking through the
#                                 inventory. Unlike a cooldown, it is never mentioned to the player
#                                 — no amount of waiting would have made it fire for this death.
#
#                                 Held in a hand, a non-matching type still saves the player: that
#                                 is vanilla doing it, and the plugin cannot stop vanilla without
#                                 killing them. It is simply spent as a plain totem — none of this
#                                 type's effects, skills, rescue or cooldown apply.
#
#                                 VOID IS SPECIAL. Vanilla never lets any totem stop a void death;
#                                 the game does not even look for one. The plugin catches that hit
#                                 itself, and ONLY for types that list VOID here. A type with no
#                                 conditions never fires in the void, so adding this key to one
#                                 totem changes nothing about the others. Pair VOID with the
#                                 rescue below, or the player is saved while still falling.
#                                 Otherwise a void save looks like any other: vanilla's usual
#                                 Regeneration, Absorption and Fire Resistance, the animation, and
#                                 a totem found outside a hand still needs activation.from-inventory
#                                 in config.yml.
#
#  rescue:                        What happens to the player right after this type saves them.
#    return-to-safe-ground: false
#                                 true teleports the saved player, one tick later, back to the
#                                 last block they were standing on (not flying, not gliding, not
#                                 in water or lava). They land centred on that block, facing the
#                                 way they already were, with their fall speed wiped.
#
#                                 If no such spot is known — they joined and fell before taking a
#                                 step — or it is in ANOTHER world (they entered the End and fell
#                                 before touching ground there), they go to the spawn of the world
#                                 they are in instead.
#
#                                 Slow falling is NOT added for you. If you want it, list
#                                 SLOW_FALLING under effects: like any other effect; effects are
#                                 applied after the teleport and survive it.
#
#  mode: resurrect                WHAT this type does for the player carrying it.
#                                   resurrect       -> the classic totem, and the default: the
#                                                      death is cancelled and the player lives.
#                                   keep-inventory  -> the player DIES, but respawns with every
#                                                      item they carried. Exactly one unit of this
#                                                      totem is used up per death.
#                                 An unknown value is logged and read as `resurrect`.
#
#                                 A keep-inventory totem NEVER resurrects anybody. The plugin skips
#                                 it when looking for a totem to save a player, so it is never
#                                 wasted on a death another totem could have prevented. Held in a
#                                 hand, where vanilla would normally use it, it is taken back out of
#                                 vanilla's hands: if any resurrect totem is usable the player is
#                                 saved by THAT one (and keeps the keeper), otherwise they die and
#                                 the keeper keeps their inventory.
#
#                                 Everything else still applies to it: item, stack-size, cooldown
#                                 (and its bypass permissions), permission, conditions, the world
#                                 blacklist, activation.from-inventory, and the look keys.
#                                 conditions.causes is read from the hit that killed the player, so
#                                 `causes: [VOID]` makes a keeper that only works in the void.
#
#                                 Keys that only describe a resurrection are IGNORED on it, with a
#                                 warning: heal-to-full, effects, skills and rescue. `consume:
#                                 false` is refused too — a keeper is always used up.
#
#                                 It does not have to be a Totem of Undying. Unlike resurrect
#                                 totems, keep-inventory totems are found in ANY slot whatever
#                                 their material, so a Nexo item built on PAPER works everywhere.
#
#                                 Does nothing when the player would keep their inventory anyway —
#                                 the keepInventory gamerule, or another plugin deciding so first.
#                                 The totem is not spent in that case.
#
#  keep-experience: false         keep-inventory totems only. true also keeps the player's levels
#                                 and drops no experience orbs. false (the default) lets experience
#                                 drop exactly as in vanilla. Ignored, with a warning, on a
#                                 resurrect totem — a player who never died loses no experience.
#
# ---------------------------------------------------------------------------------------------

totems:

  # -------------------------------------------------------------------------------------------
  #  RESERVED ENTRY — do not rename this key
  # -------------------------------------------------------------------------------------------
  #  `vanilla` describes the plain Totem of Undying, and it is the type every totem WITHOUT a tag
  #  is treated as. That is the rule that makes the rest of the file work: the plugin never has
  #  to hunt down every totem that already existed on the server, it just says "untagged means
  #  vanilla" and normalization stamps them as they pass through a player's hands.
  #
  #  Deleting this section is allowed — the plugin falls back to exactly the values below.
  #
  #  It deliberately carries NO custom effects. A plain totem should do what a plain totem does;
  #  a player who has never heard of this plugin should not be surprised by it. Give it effects
  #  only if you really mean to change the vanilla item for everyone.
  # -------------------------------------------------------------------------------------------
  vanilla:
    item: vanilla
    # Raise this to let ordinary totems stack. 16 is a comfortable choice for a survival server;
    # 1 keeps strict vanilla behaviour.
    stack-size: 16
    # No cooldown, deliberately. This entry describes the PLAIN Totem of Undying — the item a
    # player who has never heard of this plugin already knows — and putting it on a timer would
    # change vanilla behaviour for everyone on the server. Give cooldowns to the custom types.
    cooldown: 0
    consume: true
    heal-to-full: false
    effects: []

  # -------------------------------------------------------------------------------------------
  #  EXAMPLE 1 — a straightforward upgrade
  # -------------------------------------------------------------------------------------------
  #  Heals to full instead of leaving you on half a heart, and stacks four high. The kind of
  #  totem you sell in a shop.
  # -------------------------------------------------------------------------------------------
  guardian:
    item: vanilla
    stack-size: 4
    # The modern way to give a totem its own look. Your resource pack maps this key to a model.
    # Commented out because the plugin ships no pack: uncomment it once yours defines the model,
    # or the item simply renders as an ordinary totem.
    # item-model: 'polaroid:item/guardian_totem'
    display-name: '<#95d027>ɢᴜᴀʀᴅɪᴀɴ ᴛᴏᴛᴇᴍ'
    lore:
      - '<#E9FDFB>Restores you to full health'
      - '<#E9FDFB>instead of a single heart.'
      - ''
      - '<#95d027>▸ ᴋᴇᴇᴘ ɪᴛ ᴀɴʏᴡʜᴇʀᴇ ᴏɴ ʏᴏᴜ'
    consume: true
    heal-to-full: true
    effects:
      - type: REGENERATION
        seconds: 12
        level: 3
      - type: ABSORPTION
        seconds: 30
        level: 3

  # -------------------------------------------------------------------------------------------
  #  EXAMPLE 2 — a totem with a job
  # -------------------------------------------------------------------------------------------
  #  Built for a lava death: fire resistance long enough to actually climb out, plus the speed to
  #  do it. Stacks high because it is cheap and situational.
  # -------------------------------------------------------------------------------------------
  ember:
    item: vanilla
    stack-size: 16
    # Five minutes. Stacking sixteen of these would otherwise make lava free: the cooldown is what
    # keeps a cheap, high-stacking totem from being an infinite one. The player's OTHER types are
    # unaffected while this one is waiting.
    cooldown: 300
    # The legacy route, shown here so both appear in this file. Use it only when your pack already
    # selects on custom_model_data; prefer item-model (see `guardian` above) for anything new.
    # custom-model-data: 1002
    display-name: '<#f3842c>ᴇᴍʙᴇʀ ᴛᴏᴛᴇᴍ'
    lore:
      - '<#E9FDFB>Made for the fall into lava.'
      - '<#E9FDFB>Buys you the seconds to get out.'
      - ''
      - '<#95d027>▸ ᴋᴇᴇᴘ ɪᴛ ᴀɴʏᴡʜᴇʀᴇ ᴏɴ ʏᴏᴜ'
    consume: true
    heal-to-full: false
    effects:
      - type: FIRE_RESISTANCE
        seconds: 45
        level: 1
      - type: SPEED
        seconds: 15
        level: 2
      - type: REGENERATION
        seconds: 10
        level: 2

  # -------------------------------------------------------------------------------------------
  #  EXAMPLE 3 — a permission-gated rarity
  # -------------------------------------------------------------------------------------------
  #  Only fires for a player holding `polaroidtotems.type.eclipse`. Anyone else carries it as a
  #  useless souvenir — it is skipped when the plugin looks for a totem to use.
  #
  #  Stack-size 1 is intentional: something this strong should take a slot.
  #
  #  Note the `custom-model-data`: point a resource pack at it to give this type its own texture
  #  without leaving the vanilla item. It is shown here because existing packs still use it; for a
  #  new pack prefer `item-model` (see `guardian`). If your textures are already built in Nexo,
  #  neither key applies — use `item:` alone, as in EXAMPLE 4 below.
  # -------------------------------------------------------------------------------------------
  eclipse:
    item: vanilla
    stack-size: 1
    # One hour. The strongest type on the server, so the limit is time rather than supply — a
    # player who buys ten of these still only gets one save an hour out of them.
    cooldown: 3600
    display-name: '<#cd80f7>ᴇᴄʟɪᴘsᴇ ᴛᴏᴛᴇᴍ'
    lore:
      - '<#E9FDFB>Death refuses you, briefly.'
      - '<#b6c1ec>Requires a rank to work.'
      - ''
      - '<#95d027>▸ ᴋᴇᴇᴘ ɪᴛ ᴀɴʏᴡʜᴇʀᴇ ᴏɴ ʏᴏᴜ'
    custom-model-data: 1001
    permission: 'polaroidtotems.type.eclipse'
    consume: true
    heal-to-full: true
    effects:
      - type: RESISTANCE
        seconds: 20
        level: 3
      - type: REGENERATION
        seconds: 20
        level: 3
      - type: ABSORPTION
        seconds: 60
        level: 4
      - type: NIGHT_VISION
        seconds: 30
        level: 1
        particles: false
    # A MythicMobs skill, commented out because it needs MythicMobs installed AND a skill by this
    # name in your Mythic skill files — an unknown name costs you a warning in the console on every
    # resurrection. Uncomment once both exist.
    #
    # Two entries showing the difference target-self makes: the first is applied TO the player (a
    # buff, a heal, an aura), the second is centred on them and left to the skill's own @targeter
    # (a shockwave that should hit the mobs around them, not the player it just saved).
    #
    # Inside either skill, <caster.var.totem_type> reads `eclipse` and <caster.var.totem_power>
    # reads the `power:` written here — so one EclipseRevive skill can serve several totem types.
    # skills:
    #   - skill: EclipseRevive
    #     power: 1.5
    #     target-self: true
    #   - skill: EclipseShockwave
    #     power: 1.0
    #     target-self: false

  # -------------------------------------------------------------------------------------------
  #  EXAMPLE 4 — backed by a Nexo item
  # -------------------------------------------------------------------------------------------
  #  This is the whole recipe for a Nexo-textured totem: point `item:` at the Nexo id and stop.
  #  Nexo hands back a finished item that already carries its own model, so there is deliberately
  #  NO item-model and NO custom-model-data here — setting either would overwrite what Nexo just
  #  gave the item.
  #
  #  `nexo-my_totem` works too; the plugin accepts either separator.
  #
  #  Commented out because it needs a Nexo item that actually exists. With Nexo absent, or the id
  #  unknown, the type simply cannot be handed out and the command says so — the rest of the file
  #  keeps working.
  #
  #  ONE REAL CONSTRAINT, worth reading before you build the item in Nexo: base it on
  #  TOTEM_OF_UNDYING. The inventory-wide search matches on that material (see the note below), so
  #  a totem built on any other material is only found in a hand, exactly like a vanilla one — you
  #  would lose the feature this plugin exists for.
  # -------------------------------------------------------------------------------------------
  # nexus:
  #   item: 'nexo:nexus_totem'
  #   stack-size: 8
  #   display-name: '<#22e8bc>ɴᴇxᴜs ᴛᴏᴛᴇᴍ'
  #   lore:
  #     - '<#E9FDFB>Its texture comes from Nexo.'
  #     - ''
  #     - '<#95d027>▸ ᴋᴇᴇᴘ ɪᴛ ᴀɴʏᴡʜᴇʀᴇ ᴏɴ ʏᴏᴜ'
  #   consume: true
  #   heal-to-full: true
  #   effects:
  #     - type: REGENERATION
  #       seconds: 15
  #       level: 2

  # -------------------------------------------------------------------------------------------
  #  EXAMPLE 5 — a totem for one specific death
  # -------------------------------------------------------------------------------------------
  #  Only fires when a player falls into the void of THE END, and then puts them back on the last
  #  block they stood on, drifting down under slow falling. Everywhere else it is dead weight in
  #  the inventory — the plugin skips it and uses the player's other totems as usual.
  #
  #  Vanilla totems never save anyone from the void. This one can only because it NAMES VOID in
  #  its conditions; see `conditions:` at the top of this file.
  # -------------------------------------------------------------------------------------------
  voidwalker:
    item: vanilla
    stack-size: 4
    # Ten minutes. A void rescue is a very strong save, and without a limit a stack of these makes
    # End islands risk-free.
    cooldown: 600
    display-name: '<#7b6cf6>ᴠᴏɪᴅᴡᴀʟᴋᴇʀ ᴛᴏᴛᴇᴍ'
    lore:
      - '<#E9FDFB>Catches you when you fall'
      - '<#E9FDFB>into the void of the End.'
      - ''
      - '<#95d027>▸ ᴋᴇᴇᴘ ɪᴛ ᴀɴʏᴡʜᴇʀᴇ ᴏɴ ʏᴏᴜ'
    conditions:
      causes: [VOID]
      environments: [THE_END]
    rescue:
      return-to-safe-ground: true
    consume: true
    heal-to-full: false
    effects:
      # The whole point: the teleport puts them back on solid ground, and this makes sure a
      # spot on the very edge of an island does not become a second fall.
      - type: SLOW_FALLING
        seconds: 20
        level: 1
      - type: RESISTANCE
        seconds: 10
        level: 2

  # -------------------------------------------------------------------------------------------
  #  EXAMPLE 6 — a totem that lets you die, but keeps your things
  # -------------------------------------------------------------------------------------------
  #  Not a save at all: the player dies, the death screen shows, and they respawn with every item
  #  they were carrying. One keeper is used up for it. Experience still drops as usual.
  #
  #  Resurrect totems always come first. A player carrying a `guardian` AND a `keeper` is saved by
  #  the guardian and never touches the keeper; the keeper only matters when nothing could save
  #  them. See `mode:` at the top of this file.
  # -------------------------------------------------------------------------------------------
  keeper:
    item: vanilla
    mode: keep-inventory
    # Leave experience to drop as normal. Set true to keep levels too.
    keep-experience: false
    stack-size: 4
    # Thirty minutes. Without a limit a stack of these is permanent keep-inventory for whoever can
    # afford them; with one, it is insurance for a bad half-hour.
    cooldown: 1800
    display-name: '<#289bd0>ᴋᴇᴇᴘᴇʀ ᴛᴏᴛᴇᴍ'
    lore:
      - '<#E9FDFB>It will not save your life,'
      - '<#E9FDFB>but it will save your things.'
      - ''
      - '<#95d027>▸ ᴋᴇᴇᴘ ɪᴛ ᴀɴʏᴡʜᴇʀᴇ ᴏɴ ʏᴏᴜ'

  # ===========================================================================================
  #  MYTHICMOBS BASE TOTEMS
  # ===========================================================================================
  #  Every totem below casts one skill from the PolaroidTotems MythicMobs pack, which this plugin
  #  installs by itself into plugins/MythicMobs/Packs/PolaroidTotems/ on startup (see
  #  `mythicmobs.install-pack` in config.yml). They fire exactly like a vanilla totem: on the hit
  #  that would have killed you, never on a right-click.
  #
  #  Without MythicMobs they still save you like a plain totem — the skill is simply not cast.
  #
  #  `target-self: false` on all of them: each skill line picks its own @targeter, so the skill
  #  decides who it hits (enemies around you, nearby players, or you).
  # ===========================================================================================

  # A ring of fire burns everything around you.
  phoenix:
    item: vanilla
    stack-size: 1
    cooldown: 600
    display-name: '<#f3842c>ᴘʜᴏᴇɴɪx ᴛᴏᴛᴇᴍ'
    lore:
      - '<#E9FDFB>You rise in flames, and'
      - '<#E9FDFB>everything near you burns.'
      - ''
      - '<#b6c1ec>Powered by MythicMobs'
    consume: true
    heal-to-full: false
    effects: []
    skills:
      - skill: PT_Phoenix
        power: 1.0
        target-self: false

  # Drains the enemies that were hitting you. Melee deaths only.
  vampire:
    item: vanilla
