# ---------------------------------------------------------------------------------------------
#  A note on `item:` and inventory-wide search
# ---------------------------------------------------------------------------------------------
#  The inventory-wide search matches on the TOTEM_OF_UNDYING material, deliberately. It runs at
#  the moment a player would otherwise die, and it has to be fast enough to be invisible; a
#  material check is one field comparison, while "does this item carry our tag" means reading
#  item metadata for every slot.
#
#  What that means for you: a type whose `item:` points at a different material (a Nexo item
#  built on PAPER, say) still works perfectly when held in a hand, but will not be found by the
#  inventory-wide search. If you want a custom-textured totem that works from anywhere, back it
#  with the totem material and use `custom-model-data:` — or build the Nexo item on top of
#  TOTEM_OF_UNDYING.
#
#  keep-inventory totems are the exception. They are looked for when a player has already died,
#  which is rare enough to afford reading every slot, so they are found in any slot whatever
#  their material.
# ---------------------------------------------------------------------------------------------
