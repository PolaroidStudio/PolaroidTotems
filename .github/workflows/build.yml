name: Build & Release

on:
  push:
    branches: ["**"]
    tags: [ 'v*' ]
    paths-ignore:
      - '*.md'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '*.md'
      - '.gitignore'

# Un build por rama. Si empujás dos veces seguidas, el anterior se cancela
# en vez de encolarse y competir por la CPU del runner.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Los tags son necesarios para calcular el changelog.
          fetch-depth: 0

      # Hacen falta DOS JDKs, uno por jar.
      #
      # El jar de 1.21.x compila contra paper-api 1.21.11 (bytecode Java 21) y el de 26.x contra
      # paper-api 26.2, que viene compilado a Java 25: `--release 21` no puede siquiera LEER esos
      # class files ("class file has wrong version 69.0, should be 65.0"), así que ese jar se
      # compila con release 25. Cada tarea de compilación pide su javac vía javaToolchains, y
      # gradle.properties tiene auto-download en false a propósito — los JDKs se instalan acá.
      #
      # Gradle corre sobre el ÚLTIMO java-version de la lista (21), que es lo que queremos: Gradle
      # 9.x no corre sobre JDK 25.
      - name: Set up JDK 25 and 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            25
            21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Los tests corren en ramas y PRs, antes del jar. Son de lógica pura
      # (clamp del stack-size, parseo de totems.yml): no necesitan servidor ni
      # Docker.
      # En el push a main se omiten: ya se validaron pre-merge y un flake no
      # debe bloquear el release.
      - name: Test (ramas y PRs)
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')) }}
        run: ./gradlew test --no-daemon
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      # `allJars`, no `build`: este proyecto publica DOS jars desde un mismo árbol de fuentes, uno
      # por era de Minecraft (1.21.x y 26.x). Difieren sólo en el api-version que processResources
      # inyecta y en el nivel de bytecode; no hay capa de compatibilidad ni clases duplicadas.
      #
      # Tampoco hay shadowJar ni dependencias de runtime: no hay base de datos, así que no hay
      # Hikari ni drivers JDBC que resolver. Los dos jars van limpios.
      - name: Build
        run: ./gradlew allJars --no-daemon
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      # Versión leída del archivo (evita una 2ª invocación de Gradle).
      - name: Get version
        id: version
        run: |
          VERSION=$(grep -E '^version=' gradle.properties | head -1 | cut -d'=' -f2)
          if [ -z "$VERSION" ]; then
            echo "::error::No se pudo leer la versión desde gradle.properties"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versión: $VERSION"

      - name: Generate changelog
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: changelog
        shell: bash
        run: |
          # Tag más cercano en la historia de HEAD = el release anterior. Se usa
          # describe (topológico) y no un sort por versión, que se rompe si el
          # esquema de versión cambió (p.ej. tags viejos v3.x junto a v1.x).
          # Agrupamos por tipo de conventional commit y descartamos el ruido.
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            RANGE=""; RANGE_DESC="el inicio"
          else
            RANGE="$PREV_TAG..HEAD"; RANGE_DESC="$PREV_TAG"
          fi

          # hash <TAB> subject <TAB> autor <TAB> correo, sin merges (ruido de integración).
          # El correo lleva el usuario de GitHub, que es lo que enlaza a un perfil; el nombre
          # del autor no tiene por qué coincidir con él.
          COMMITS=$(git log $RANGE --no-merges --pretty=format:'%h%x09%s%x09%an%x09%ae')
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"

          feat=""; fix=""; perf=""; brk=""; other=""
          while IFS=$'\t' read -r hash subject author email; do
            [ -z "$subject" ] && continue
            # type(scope)!: descripción  — scope y '!' opcionales.
            if [[ "$subject" =~ ^([a-zA-Z]+)(\([^\)]*\))?(!)?:[[:space:]]*(.*)$ ]]; then
              type="${BASH_REMATCH[1]}"; bang="${BASH_REMATCH[3]}"; desc="${BASH_REMATCH[4]}"
            else
              type="_"; bang=""; desc="$subject"
            fi
            # El hash enlaza a su commit; el autor, a su perfil. Un correo noreply de GitHub
            # tiene la forma id+usuario@users.noreply.github.com, de donde sale el usuario real.
            if [[ "$email" =~ ^([0-9]+\+)?([^@]+)@users\.noreply\.github\.com$ ]]; then
              handle="${BASH_REMATCH[2]}"
            else
              handle=""
            fi
            line="- ${desc} ([\`${hash}\`](${REPO_URL}/commit/${hash}))"
            if [ -n "$handle" ]; then
              line+=" por [@${handle}](${{ github.server_url }}/${handle})"
            elif [ -n "$author" ]; then
              line+=" por ${author}"
            fi
            # Un commit marcado breaking ('!') va SOLO a Breaking, no se duplica.
            if [ -n "$bang" ]; then brk+="${line}"$'\n'; continue; fi
            case "$type" in
              feat) feat+="${line}"$'\n' ;;
              fix)  fix+="${line}"$'\n' ;;
              perf) perf+="${line}"$'\n' ;;
              chore|ci) : ;;   # ruido: no entra al release
              *)    other+="${line}"$'\n' ;;
            esac
          done <<< "$COMMITS"

          CL=""
          [ -n "$brk" ]   && CL+=$'### ⚠️ Breaking Changes\n'"$brk"$'\n'
          [ -n "$feat" ]  && CL+=$'### ✨ Features\n'"$feat"$'\n'
          [ -n "$fix" ]   && CL+=$'### 🐛 Fixes\n'"$fix"$'\n'
          [ -n "$perf" ]  && CL+=$'### ⚡ Performance\n'"$perf"$'\n'
          [ -n "$other" ] && CL+=$'<details><summary>Otros cambios</summary>\n\n'"$other"$'</details>\n'
          [ -z "$CL" ]    && CL="- Sin cambios relevantes desde ${RANGE_DESC}"

          # Pie con el diff completo contra la release anterior, que el changelog resume.
          TAG="v${{ steps.version.outputs.version }}-b${{ github.run_number }}"
          if [ -n "$PREV_TAG" ]; then
            CL+=$'\n---\n\n'"**Todos los cambios**: [\`${PREV_TAG}...${TAG}\`](${REPO_URL}/compare/${PREV_TAG}...${TAG})"$'\n'
          fi

          {
            echo "CHANGELOG<<GH_CHANGELOG_EOF"
            printf '%s\n' "$CL"
            echo "GH_CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # Falla temprano y con un mensaje claro si Gradle no produjo LOS DOS jars, en vez de publicar
      # una Release incompleta. Los nombres salen de registerTargetJar en build.gradle.kts: con
      # BUILD_NUMBER presente, archiveVersion pasa a ser "<version>-b<run>-<classifier>".
      #
      # Además del nombre se verifica el api-version que lleva cada uno adentro. Es la línea que
      # justifica que existan dos jars, y si processResources la inyectara mal el jar cargaría en
      # el servidor equivocado — un fallo silencioso que nadie ve hasta que un usuario lo reporta.
      - name: Verify artifacts
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          V="${{ steps.version.outputs.version }}-b${{ github.run_number }}"
          status=0
          check() {
            JAR="build/libs/PolaroidTotems-${V}-$1.jar"
            if [ ! -f "$JAR" ]; then
              echo "::error::Falta el artefacto esperado: $JAR"
              status=1
              return
            fi
            FOUND=$(unzip -p "$JAR" paper-plugin.yml | sed -n "s/^api-version: *'\(.*\)'/\1/p")
            if [ "$FOUND" != "$2" ]; then
              echo "::error::$JAR declara api-version '$FOUND'; se esperaba '$2'"
              status=1
            fi
          }
          check mc1.21.11 1.21
          check mc26.2 26.2
          if [ "$status" -ne 0 ]; then
            echo "Contenido de build/libs:"; ls -la build/libs || true
            exit 1
          fi

      - name: Create Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-b${{ github.run_number }}
          name: "PolaroidTotems v${{ steps.version.outputs.version }} (build ${{ github.run_number }})"
          body: |
            ## Changelog
            ${{ steps.changelog.outputs.CHANGELOG }}

            ## Cuál descargar

            Hay **dos jars**: elegí el de la versión de tu servidor y poné ese solo en `plugins/`.

            | Archivo | Para servidores en | Requiere |
            |---|---|---|
            | `PolaroidTotems-${{ steps.version.outputs.version }}-b${{ github.run_number }}-mc1.21.11.jar` | la línea **1.21.x** | Java 21+ |
            | `PolaroidTotems-${{ steps.version.outputs.version }}-b${{ github.run_number }}-mc26.2.jar` | la línea **26.x** | Java 25+ |

            Son dos porque `api-version` lo lee el servidor antes de que corra una sola línea del
            plugin, así que no se puede decidir en tiempo de ejecución; y porque paper-api 26.2
            viene compilado a Java 25. El código fuente es el mismo para ambos.

            ## Requisitos

            | | |
            |---|---|
            | Servidor | Paper **1.21**+ (piso, no techo) |
            | Opcional | [Nexo](https://nexomc.com) — items personalizados y glyphs |
          files: |
            build/libs/PolaroidTotems-${{ steps.version.outputs.version }}-b${{ github.run_number }}-mc1.21.11.jar
            build/libs/PolaroidTotems-${{ steps.version.outputs.version }}-b${{ github.run_number }}-mc26.2.jar
          generate_release_notes: false
          make_latest: true

      # Las ramas no suben el jar: consume el storage de Actions de la cuenta y para probar de
      # verdad ya está la Release que publica main. Lo que importa de un build de rama es que
      # compile y que pasen los tests, y eso ya quedó reflejado en el estado del run.
