version=1.0.0

# Use a locally installed JDK; never let Gradle download one behind the user's back.
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64

org.gradle.parallel=true
org.gradle.caching=true

# Besides skipping configuration on a repeat build, this is what lets the two per-target compile
# tasks run at the same time: without it, tasks of a single project run one after another.
org.gradle.configuration-cache=true
